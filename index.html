<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LaoLao · ຮຽນພາສາລາວ</title>
<meta name="description" content="Learn Lao language through sentence patterns: script, romanization, audio, dictionary, sentence generator, quizzes and review. Works offline.">
<meta property="og:title" content="LaoLao · ຮຽນພາສາລາວ">
<meta property="og:description" content="Learn Lao language through sentence patterns: script, romanization, audio, dictionary, sentence generator, quizzes and review. Works offline.">
<meta name="theme-color" content="#0284C7">
<script>try{var t=localStorage.getItem("laolao_theme");t={light:"day",dark:"night",auto:"system"}[t]||t;document.documentElement.setAttribute("data-theme",["day","night","system"].indexOf(t)>=0?t:"day")}catch(e){}</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Noto+Sans+Lao:wght@400;500;600;700&family=Noto+Serif+Lao:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<link rel="stylesheet" href="css/app.css">
<script type="importmap">
{
  "imports": {
    "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"
  }
}
</script>
</head>
<body>
<div id="root">
  <div class="waiting-screen">
    <div class="floating-elements">
      <div class="float-glyph">ກ</div>
      <div class="float-glyph">ດ</div>
      <div class="float-glyph">ນ</div>
      <div class="float-glyph">ສ</div>
      <div class="float-glyph">ລ</div>
      <div class="float-glyph">ຮ</div>
    </div>
    <div class="waiting-card">
      <div class="champa-wrap">
        <div class="champa-halo"></div>
        <svg class="champa-svg" viewBox="0 0 200 200" width="110" height="110">
          <defs>
            <radialGradient id="champaYellowCore0" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#F59E0B" />
              <stop offset="40%" stop-color="#FBBF24" />
              <stop offset="70%" stop-color="#FEF08A" stop-opacity="0.9" />
              <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
            </radialGradient>
            <linearGradient id="champaPetalGrad0" x1="0%" y1="100%" x2="0%" y2="0%">
              <stop offset="0%" stop-color="#FEF3C7" />
              <stop offset="35%" stop-color="#FFFFFF" />
              <stop offset="100%" stop-color="#FFFFFF" />
            </linearGradient>
          </defs>
          <g transform="translate(100, 100)">
            <path d="M 0,-15 C -24,-34 -34,-74 0,-92 C 34,-74 24,-34 0,-15 Z" fill="url(#champaPetalGrad0)" stroke="#BAE6FD" stroke-width="1.2" transform="rotate(0)" />
            <path d="M 0,-15 C -24,-34 -34,-74 0,-92 C 34,-74 24,-34 0,-15 Z" fill="url(#champaPetalGrad0)" stroke="#BAE6FD" stroke-width="1.2" transform="rotate(72)" />
            <path d="M 0,-15 C -24,-34 -34,-74 0,-92 C 34,-74 24,-34 0,-15 Z" fill="url(#champaPetalGrad0)" stroke="#BAE6FD" stroke-width="1.2" transform="rotate(144)" />
            <path d="M 0,-15 C -24,-34 -34,-74 0,-92 C 34,-74 24,-34 0,-15 Z" fill="url(#champaPetalGrad0)" stroke="#BAE6FD" stroke-width="1.2" transform="rotate(216)" />
            <path d="M 0,-15 C -24,-34 -34,-74 0,-92 C 34,-74 24,-34 0,-15 Z" fill="url(#champaPetalGrad0)" stroke="#BAE6FD" stroke-width="1.2" transform="rotate(288)" />
            <circle cx="0" cy="0" r="32" fill="url(#champaYellowCore0)" />
            <circle cx="0" cy="0" r="14" fill="#D97706" fill-opacity="0.25" />
            <text x="0" y="8" font-family="'Noto Sans Lao', 'Phetsarath OT', sans-serif" font-size="22" font-weight="700" fill="#B45309" text-anchor="middle">ລ</text>
          </g>
        </svg>
      </div>
      <h1 class="lao-sabaidee">ສະບາຍດີ</h1>
      <p class="waiting-sub">LaoLao · ຮຽນພາສາລາວ</p>
      <p class="waiting-note">ກຳລັງຕຽມຄວາມພ້ອມ... / Loading LaoLao...</p>
      <div class="mekong-stream">
        <div class="mekong-shimmer"></div>
      </div>
    </div>
  </div>
</div>
<script>
window.__laolaoReload = function() { location.reload(); };
window.__laolaoClear = function() { localStorage.clear(); location.reload(); };
window.__laolaoReset = function() {
  if (confirm("Reset demo data and cache?")) {
    localStorage.clear();
    try { indexedDB.deleteDatabase("laolao-demo"); } catch(e){}
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        for (var i = 0; i < regs.length; i++) regs[i].unregister();
        location.reload();
      }).catch(function() { location.reload(); });
    } else {
      location.reload();
    }
  }
};
window.addEventListener("error", function(e) {
  console.error("LaoLao startup error:", e);
  var note = document.querySelector(".waiting-note");
  if (note) {
    note.innerHTML = '<span style="color:var(--bad,#ef4444);font-weight:600">ເກີດຂໍ້ຜິດພາດໃນການໂຫລດ / Startup Notice</span><br><div style="margin-top:10px;display:flex;gap:8px;justify-content:center"><button onclick="window.__laolaoReload()" style="padding:6px 14px;background:var(--accent,#0284c7);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600">ໂຫລດໃໝ່ / Reload</button><button onclick="window.__laolaoClear()" style="padding:6px 14px;background:var(--surface-2,#e2e8f0);color:var(--ink,#1e293b);border:none;border-radius:8px;cursor:pointer">ລ້າງແຄຊ / Clear Cache</button></div>';
  }
});
setTimeout(function() {
  var note = document.querySelector(".waiting-note");
  var waitingScreen = document.querySelector(".waiting-screen");
  if (waitingScreen && note && !document.querySelector(".app") && !document.querySelector(".auth-card")) {
    note.innerHTML = '<span>ກຳລັງໂຫລດ... / Taking longer than usual?</span><br><div style="margin-top:10px;display:flex;gap:8px;justify-content:center"><button onclick="window.__laolaoReload()" style="padding:6px 14px;background:var(--accent,#0284c7);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600">ໂຫລດໃໝ່ / Reload</button><button onclick="window.__laolaoReset()" style="padding:6px 14px;background:var(--surface-2,#e2e8f0);color:var(--ink,#1e293b);border:none;border-radius:8px;cursor:pointer">ເລີ່ມໃໝ່ / Reset</button></div>';
  }
}, 8000);
</script>
<script src="env-config.js"></script>
<script type="module" src="js/learner/main.js"></script>
<script>
if ("serviceWorker" in navigator && /^https?:/.test(location.protocol)) {
  window.addEventListener("load", function() {
    navigator.serviceWorker.register("sw.js").then(function(reg) {
      reg.update();
    }).catch(function() {});
  });
}
</script>
</body>
</html>
