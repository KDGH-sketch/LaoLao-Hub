<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LaoLao Admin</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0284C7">
<script>try{var t=localStorage.getItem("laolao_theme");t={light:"day",dark:"night",auto:"system"}[t]||t;document.documentElement.setAttribute("data-theme",["day","night","system"].indexOf(t)>=0?t:"day")}catch(e){}</script>
<link rel="icon" href="../icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;500;600;700&family=Noto+Serif+Lao:wght@500;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<link rel="stylesheet" href="../css/app.css">
<link rel="stylesheet" href="../css/admin.css">
<script src="https://cdn.tailwindcss.com"></script>
<script>
// Map Tailwind utilities onto the app's existing CSS-variable design tokens (css/app.css :root),
// so e.g. bg-surface / text-ink-2 / border-line automatically follow day/night theme switching
// without a build step and without a second, conflicting color system.
tailwind.config = {
  theme: {
    extend: {
      colors: {
        bg: "var(--bg)", surface: "var(--surface)", "surface-2": "var(--surface-2)", "surface-3": "var(--surface-3)",
        ink: "var(--ink)", "ink-2": "var(--ink-2)", "ink-3": "var(--ink-3)",
        line: "var(--line)", "line-2": "var(--line-2)",
        accent: "var(--accent)", "accent-hover": "var(--accent-hover)", "accent-2": "var(--accent-2)", "accent-3": "var(--accent-3)",
        jade: "var(--jade)", "jade-2": "var(--jade-2)", warn: "var(--warn)", "warn-2": "var(--warn-2)", bad: "var(--bad)", "bad-2": "var(--bad-2)"
      },
      borderRadius: { DEFAULT: "var(--r)", s: "var(--r-s)" },
      boxShadow: { card: "var(--shadow)", "card-lg": "var(--shadow-lg)" },
      fontFamily: { ui: ["var(--f-ui)"] }
    }
  }
};
</script>
<script type="importmap">
{
  "imports": {
    "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"
  }
}
</script>
</head>
<body>
<div id="root"><div class="empty" style="margin:40px">Loading…</div></div>
<script>
window.addEventListener("error", function(e) {
  console.error("Admin startup error:", e);
  var r = document.getElementById("root");
  if (r && r.querySelector(".empty")) {
    r.innerHTML = '<div style="margin:40px;padding:20px;background:var(--surface,#fff);border-radius:12px;border:1px solid var(--border);text-align:center"><p style="color:var(--bad,#ef4444);font-weight:600">Failed to load admin module</p><button onclick="location.reload()" style="padding:6px 14px;background:var(--accent,#0284c7);color:#fff;border:none;border-radius:8px;cursor:pointer">Reload</button></div>';
  }
});
</script>
<script src="../env-config.js"></script>
<script type="module" src="../js/admin/main.js"></script>
</body>
</html>
