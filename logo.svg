<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <defs>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#BAE6FD" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284C7" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Icon Emblem -->
  <g transform="translate(10, 10)">
    <rect width="60" height="60" rx="16" fill="url(#logoBg)"/>
    <circle cx="30" cy="30" r="23" stroke="url(#ringGrad)" stroke-width="2" fill="none"/>
    <path d="M 8 46 Q 30 38 52 46 L 52 56 Q 30 54 8 56 Z" fill="#FFFFFF" fill-opacity="0.12"/>
    <circle cx="30" cy="14" r="2.5" fill="#FFFFFF" fill-opacity="0.8"/>
    <text x="30" y="42" font-size="34" font-family="'Noto Sans Lao','Phetsarath OT','Lao UI',sans-serif" font-weight="700" fill="#FFFFFF" text-anchor="middle" filter="url(#logoGlow)">ລ</text>
  </g>
  <!-- Wordmark -->
  <text x="84" y="42" font-family="'Source Sans 3',system-ui,sans-serif" font-size="28" font-weight="700" fill="#0A1B2E" letter-spacing="-0.5">LaoLao</text>
  <text x="85" y="58" font-family="'Noto Sans Lao','Phetsarath OT','Lao UI',sans-serif" font-size="13" font-weight="600" fill="#0284C7" letter-spacing="0.5">ຮຽນພາສາລາວ</text>
</svg>
